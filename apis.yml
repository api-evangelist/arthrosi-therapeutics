aid: arthrosi-therapeutics
name: Arthrosi Therapeutics
description: 'Arthrosi Therapeutics, Inc. is a late-stage clinical biotechnology company
  founded in 2018 and headquartered in San Diego, California, by a team of gout specialists
  who previously led first-generation urate-transporter development at Ardea Biosciences.
  Its lead candidate, pozdeutinurad (AR882), is a once-daily oral next-generation URAT1
  inhibitor in two fully enrolled replicate global Phase 3 trials (REDUCE 1 and REDUCE
  2) for progressive and tophaceous gout, backed by roughly $299M in venture financing
  including a $153M Series E led by Prime Eight Capital. Sobi (Swedish Orphan Biovitrum)
  completed its acquisition of Arthrosi on 9 February 2026. Arthrosi is a drug developer,
  not a software company: it operates a WordPress corporate site with company, leadership
  and news pages, and publishes no developer portal, public API, SDK, package or machine-readable
  specification of any kind.'
